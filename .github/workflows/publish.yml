name: Build and Publish Immortality

on:
  workflow_dispatch:
    inputs:
      mod_version:
        description: "Mod version (example: 1.2.0)"
        required: true
        default: "1.0.0"
        type: string

      release_name:
        description: "Release name"
        required: true
        default: "Immortality"
        type: string

      version_type:
        description: "Release type"
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha

      changelog:
        description: "What's new in this release?"
        required: true
        default: "Bug fixes and improvements."
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.10"
          - minecraft: "1.21.11"
          - minecraft: "26.2"
          - minecraft: "26.3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew ":${{ matrix.minecraft }}:build"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ii0DFR8F
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: "${{ inputs.release_name }} ${{ inputs.mod_version }} - Minecraft ${{ matrix.minecraft }}"
          version: "${{ inputs.mod_version }}+${{ matrix.minecraft }}"
          version-type: ${{ inputs.version_type }}
          changelog: ${{ inputs.changelog }}

          files: |
            versions/${{ matrix.minecraft }}/build/libs/*+${{ matrix.minecraft }}.jar

          loaders: |
            fabric

          game-versions: |
            ${{ matrix.minecraft }}

          game-version-filter: none
          fail-mode: fail
