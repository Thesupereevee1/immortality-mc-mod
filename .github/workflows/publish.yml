name: Build and Publish Immortality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.10"
            java: "21"
          - minecraft: "1.21.11"
            java: "21"
          - minecraft: "26.2"
            java: "25"
          - minecraft: "26.3"
            java: "25"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew ":${{ matrix.minecraft }}:build"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: YOUR_MODRINTH_PROJECT_ID
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: Immortality for Minecraft ${{ matrix.minecraft }}
          version: ${{ github.event.release.tag_name || 'manual' }}+${{ matrix.minecraft }}
          version-type: release

          files: |
            versions/${{ matrix.minecraft }}/build/libs/*+${{ matrix.minecraft }}.jar

          loaders: |
            fabric

          game-versions: |
            ${{ matrix.minecraft }}

          game-version-filter: none
          fail-mode: fail
